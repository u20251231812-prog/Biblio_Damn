{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm col-md-6 mx-auto">
    <div class="card-header bg-primary text-white fw-bold">
        {{ 'Editar Libro' if libro else 'Nuevo Libro' }}
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Título del Libro</label>
                <input type="text" name="titulo" class="form-control" value="{{ libro.titulo if libro else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">URL de la Portada</label>
                <input type="url" name="portada_url" class="form-control" value="{{ libro.portada_url if libro else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Stock Disponible</label>
                <input type="number" name="stock_disponible" min="0" class="form-control" value="{{ libro.stock_disponible if libro else 1 }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Autor</label>
                <select name="id_autor" class="form-select" required>
                    <option value="">-- Seleccione un autor --</option>
                    {% for a in autores %}
                    <option value="{{ a.id_autor }}" {% if libro and libro.id_autor == a.id_autor %}selected{% endif %}>
                        {{ a.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Categoría</label>
                <select name="id_categoria" class="form-select" required>
                    <option value="">-- Seleccione una categoría --</option>
                    {% for c in categorias %}
                    <option value="{{ c.id_categoria }}" {% if libro and libro.id_categoria == c.id_categoria %}selected{% endif %}>
                        {{ c.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{{ url_for('libros.listar') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
