<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Digital Universitaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .navbar-custom {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
        }
        .navbar-custom .nav-link {
            color: rgba(255, 255, 255, 0.78);
            font-weight: 500;
            padding: 0.5rem 0.9rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        .navbar-custom .nav-link:hover,
        .navbar-custom .nav-link.active {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.14);
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm py-3 mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('index') }}">
      <i class="bi bi-book-half fs-4 text-info"></i>
      <span class="tracking-wide">BIBLIOTECA DIGITAL</span>
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav mx-auto gap-1 my-2 my-lg-0">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">
            <i class="bi bi-grid-1x2 me-1"></i> Catálogo y QR
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.blueprint == 'libros' %}active{% endif %}" href="{{ url_for('libros.listar') }}">
            <i class="bi bi-journal-bookmark me-1"></i> Libros
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.blueprint == 'reservas' and request.endpoint != 'reservas.escanear_qr' %}active{% endif %}" href="{{ url_for('reservas.listar') }}">
            <i class="bi bi-calendar2-check me-1"></i> Reservas
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.blueprint == 'estudiantes' %}active{% endif %}" href="{{ url_for('estudiantes.listar') }}">
            <i class="bi bi-people me-1"></i> Estudiantes
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.blueprint == 'autores' %}active{% endif %}" href="{{ url_for('autores.listar') }}">
            <i class="bi bi-pen me-1"></i> Autores
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.blueprint == 'categorias' %}active{% endif %}" href="{{ url_for('categorias.listar') }}">
            <i class="bi bi-tags me-1"></i> Categorías
          </a>
        </li>
      </ul>

      <a href="{{ url_for('reservas.escanear_qr') }}" class="btn btn-warning fw-semibold rounded-pill px-3 shadow-sm d-inline-flex align-items-center gap-2">
        <i class="bi bi-qr-code-scan"></i>
        <span>Validar QR</span>
      </a>
    </div>
  </div>
</nav>

<div class="container pb-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, msg in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm border-0">
                {{ msg }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
