{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm col-md-6 mx-auto">
    <div class="card-header bg-primary text-white fw-bold">
        {{ 'Editar Estudiante' if estudiante else 'Nuevo Estudiante' }}
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Código Estudiantil</label>
                <input type="text" name="codigo_estudiantil" class="form-control" value="{{ estudiante.codigo_estudiantil if estudiante else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nombre Completo</label>
                <input type="text" name="nombre" class="form-control" value="{{ estudiante.nombre if estudiante else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Correo Institucional</label>
                <input type="email" name="correo" class="form-control" value="{{ estudiante.correo if estudiante else '' }}" required>
            </div>
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{{ url_for('estudiantes.listar') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
