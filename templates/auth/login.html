<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Biblioteca Digital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
    }
    .login-card { width: 100%; max-width: 400px; border-radius: 16px; background: #fff; }
    .btn-brand { background: #facc15; border-color: #facc15; color: #0f172a; font-weight: 600; }
    .btn-brand:hover { background: #eab308; border-color: #eab308; color: #0f172a; }
  </style>
</head>
<body>
  <div class="login-card shadow-lg p-4 p-md-5 m-3">
    <div class="text-center mb-4">
      <i class="bi bi-book-half fs-1 text-primary"></i>
      <h4 class="fw-bold mt-2 mb-1">Biblioteca Digital</h4>
      <p class="text-muted small mb-0">Inicia sesión para continuar</p>
    </div>

    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensaje in mensajes %}
        <div class="alert alert-{{ categoria }} py-2 small">{{ mensaje }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Usuario (tu nombre)</label>
        <input type="text" name="nombre" class="form-control" required autofocus autocomplete="username">
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">Contraseña</label>
        <input type="password" name="password" class="form-control" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-brand w-100 py-2">Entrar</button>
    </form>
  </div>
</body>
</html>
