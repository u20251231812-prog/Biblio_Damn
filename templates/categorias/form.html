{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm col-md-6 mx-auto">
    <div class="card-header bg-primary text-white fw-bold">
        {{ 'Editar Categoría' if categoria else 'Nueva Categoría' }}
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre de la Categoría</label>
                <input type="text" name="nombre" class="form-control" value="{{ categoria.nombre if categoria else '' }}" required>
            </div>
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{{ url_for('categorias.listar') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
