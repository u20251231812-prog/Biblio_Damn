{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-warning fw-bold">Panel Bibliotecaria: Validar Entrega de Libro</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Escanea o digita el Código QR del Estudiante:</label>
                        <input type="text" name="codigo_qr" class="form-control form-control-lg" placeholder="Ej: QR-RES-1001" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Confirmar Reclamo y Descontar Stock</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
